# Link: component contract (draft, best guess, 22 Oct 2026)
# Derived from the Figma component set "Link" (file DS Workflow test, page "Link Turm", node 85:227).
# There is no code for Link yet, so nothing here is checked against an implementation.
# "guess" = not in Figma, I assumed it. "OPEN" = needs a decision.

component: Link
status: draft
purpose: Text link that goes somewhere else (another page or view).
not_for:
  - Actions on the current page. Use Button.
replaces: [Small, Small underlined, Login, Back, Link mit Pfeil, Link Inhalt laden]
sources:
  figma: { file: Qg7XFgQigOnQuD40ATSl9O, page: Link Turm, node: "85:227" }
  code: none

anatomy:
  link:          { type: container, layout: row }
  content:       { type: container, layout: row, parent: link, gap: 4, padding_bottom: 4, border: bottom }
  icon_leading:  { type: slot, parent: content, optional: true, allowed: [icon], size: 16 }
  label:         { type: text, parent: content }
  icon_trailing: { type: slot, parent: content, optional: true, allowed: [icon], size: 16 }

props:
  text:          { type: string, default: "Hier einloggen", figma: "Link Text" }
  size:          { type: enum, values: [S, M], default: S }
  emphasis:      { type: enum, values: [primary, secondary, quiet], default: primary }
  leading_icon:  { type: slot, nullable: true, allowed: [icon], default: null, figma: "Show Leading Icon + Swap Leading Icon" }
  trailing_icon: { type: slot, nullable: true, allowed: [icon], default: null, figma: "Show Trailing Icon + Swap Trailing Icon" }
  href:          { type: string, required: true, non_visual: true }   # guess, not in Figma
  disabled:      { type: boolean, default: false }                    # guess, Figma has State=Disabled
states: [idle, hover, focus, pressed, disabled]                       # guess: set by interaction, not by the author

# Not props and not variants: the same component in different contexts (Figma variable modes).
modes:
  typography_role:     [SZ, SZ Interview, SZ Meinung, SZ Reportage, Magazin, Magazin Interview, Jetzt, Jetzt Meinung, Dossier]
  typography_semantic: [Mobile, Tablet, Desktop]
  color:               [light, dark]

# Default = emphasis primary, state idle.
styles:
  content:
    gap: 4
    padding_bottom: 4
    border_bottom: { width: 1, color: Link/Border/Primary/Idle }
  label:
    color: Link/Content/Primary/Idle
    typography: { family: SZSansDigital, style: Regular, size: { S: 12, M: 14 }, line_height: 115%, letter_spacing: 2%, source: typography variables }
  icon:
    size: 16

# Overrides, applied in order. A later entry wins.
variants:
  - when: { emphasis: secondary }
    set: { content.border_bottom.color: Link/Border/Secondary/Idle }
  - when: { emphasis: quiet }
    set: { content.border_bottom: none }
  - when: { state: hover, emphasis: primary }
    set: { content.border_bottom.color: Link/Border/Secondary/Idle }
  - when: { state: hover, emphasis: secondary }
    set: { content.border_bottom.color: Link/Border/Primary/Idle }
  - when: { state: hover, emphasis: quiet }
    set: { content.border_bottom: { width: 1, color: Link/Border/Secondary/Idle } }
  - when: { state: focus }
    set: { link.outline: { width: 2, align: outside, color: Color/Border/Highlight } }   # OPEN: low contrast, no Link focus token
  - when: { state: pressed }
    set: { label.color: Color/Content/Secondary/Idle/Default }   # Figma still shows the old name Color/Text/Secondary
  - when: { state: pressed, emphasis: quiet }
    set: { content.border_bottom: { width: 1, color: Link/Border/Secondary/Idle } }
  - when: { state: disabled }
    set: { label.color: Link/Content/Primary/Disabled, content.border_bottom.color: Link/Border/Primary/Disabled }
  - when: { state: disabled, emphasis: quiet }
    set: { content.border_bottom: none }

usage:
  quiet: Underline only on hover. Use only in link lists (footer, navigation).   # from the Figma note

accessibility:
  role: link
  keyboard: { Tab: moves focus to the link, Enter: follows the link }            # guess
  accessible_name: the visible text                                              # guess
  focus_indicator: 2px ring outside, Color/Border/Highlight                      # OPEN: 1.3:1 light, 1.9:1 dark
  target_size: { S: 18px high, M: 20px high }                                    # OPEN: below 24px, inline links are exempt
  disabled: aria-disabled, not followed                                          # guess
