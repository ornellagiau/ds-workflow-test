# Builds both Storybooks on every push to main and publishes them to GitHub Pages (free for public repos).
#   /      polished docs for design and product  (.storybook-docs)
#   /dev/  full Storybook for developers         (.storybook)
name: Publish Storybook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (not npm ci): lockfile may lag behind package.json in this test repo
      - run: npm install --no-audit --no-fund
      - run: npm run build-all
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
